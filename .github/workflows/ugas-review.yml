name: UGAS GitHub review evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugas-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-evidence:
    name: UGAS Review / evidence
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project reproducibly
        if: always()
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check .
      - name: Prepare evidence directories
        if: always()
        run: mkdir -p "$RUNNER_TEMP/ugas-review-evidence" "$RUNNER_TEMP/ugas-review-artifact"
      - name: Run unit tests and capture totals
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -q 2>&1 | tee "$RUNNER_TEMP/ugas-tests.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/ugas-tests.exit"
          exit "$code"
      - name: Run official validation and capture totals
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/run_validation.py 2>&1 | tee "$RUNNER_TEMP/ugas-validation.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/ugas-validation.exit"
          exit "$code"
      - name: Validate active v0.17.0 state
        if: always()
        continue-on-error: true
        run: |
          set +e
          python scripts/validation/validate_state_consistency_v0170.py
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/state.exit"
          exit "$code"
      - name: Validate equipment/outfits runtime and evidence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_equipment_runtime_v0170.py 2>&1 | tee "$RUNNER_TEMP/equipment.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/equipment.exit"
          exit "$code"
      - name: Validate v0.16.2 direction/cache regression
        if: always()
        continue-on-error: true
        run: |
          set +e
          python scripts/validation/validate_direction_runtime_v0162.py
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/direction.exit"
          exit "$code"
      - name: Validate V1 capability matrix
        if: always()
        continue-on-error: true
        run: |
          set +e
          python scripts/validation/validate_v1_capability_matrix.py
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/matrix.exit"
          exit "$code"
      - name: Run approved front compatibility regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/run_animation_runtime_v0151.py 2>&1 | tee "$RUNNER_TEMP/front-compatibility.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/front.exit"
          exit "$code"
      - name: Validate workflow structure
        if: always()
        continue-on-error: true
        run: |
          set +e
          python scripts/validation/validate_github_workflows_v0124.py --root . --output "$RUNNER_TEMP/workflow-validation.json"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/workflow.exit"
          exit "$code"
      - name: Record initial v0.17.0 results
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python scripts/validation/record_v0170_results.py \
            --test-log "$RUNNER_TEMP/ugas-tests.log" --validation-log "$RUNNER_TEMP/ugas-validation.log" \
            --test-exit-code "$(cat "$RUNNER_TEMP/ugas-tests.exit" 2>/dev/null || echo 99)" \
            --validation-exit-code "$(cat "$RUNNER_TEMP/ugas-validation.exit" 2>/dev/null || echo 99)" \
            --state-exit-code "$(cat "$RUNNER_TEMP/state.exit" 2>/dev/null || echo 99)" \
            --equipment-exit-code "$(cat "$RUNNER_TEMP/equipment.exit" 2>/dev/null || echo 99)" \
            --direction-exit-code "$(cat "$RUNNER_TEMP/direction.exit" 2>/dev/null || echo 99)" \
            --matrix-exit-code "$(cat "$RUNNER_TEMP/matrix.exit" 2>/dev/null || echo 99)" \
            --front-compatibility-exit-code "$(cat "$RUNNER_TEMP/front.exit" 2>/dev/null || echo 99)" \
            --workflow-exit-code "$(cat "$RUNNER_TEMP/workflow.exit" 2>/dev/null || echo 99)" \
            --manifest-exit-code 99 --security-exit-code 99 --output-dir "$RUNNER_TEMP/ugas-review-evidence"
      - name: Build initial v0.17.0 review manifest
        if: always()
        continue-on-error: true
        run: |
          python scripts/validation/build_github_review_manifest_v0170.py \
            --output-dir "$RUNNER_TEMP/ugas-review-evidence" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" \
            --head-branch "$HEAD_BRANCH" --pr-number "$PR_NUMBER" \
            --tests-json "$RUNNER_TEMP/ugas-review-evidence/test-results-v0170.json" \
            --validation-json "$RUNNER_TEMP/ugas-review-evidence/validation-results-v0170.json" \
            --gates-json "$RUNNER_TEMP/ugas-review-evidence/gate-results-v0170.json" \
            --front-compatibility-exit "$RUNNER_TEMP/front.exit"
      - name: Assemble bounded evidence artifact
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          artifact="$RUNNER_TEMP/ugas-review-artifact"
          mkdir -p "$artifact/equipment-outfits" "$artifact/direction-runtime" "$artifact/state" "$artifact/logs" "$artifact/governance"
          cp "$RUNNER_TEMP/ugas-review-evidence/github-review-manifest-v0170.json" "$artifact/github-review-manifest-v0170.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/ugas-review-evidence/test-results-v0170.json" "$artifact/test-results-v0170.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/ugas-review-evidence/validation-results-v0170.json" "$artifact/validation-results-v0170.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/ugas-review-evidence/gate-results-v0170.json" "$artifact/gate-results-v0170.json" 2>/dev/null || true
          cp docs/evidence/current-state.json "$artifact/state/current-state.json" 2>/dev/null || true
          cp docs/evidence/current-state-v0.16.2.json "$artifact/state/current-state-v0.16.2.json" 2>/dev/null || true
          cp -R docs/evidence/equipment-outfits-runtime-v0170/. "$artifact/equipment-outfits/" 2>/dev/null || true
          cp -R docs/evidence/multi-direction-runtime-v0162/. "$artifact/direction-runtime/" 2>/dev/null || true
          cp "$RUNNER_TEMP/ugas-tests.log" "$artifact/logs/ugas-tests.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/ugas-validation.log" "$artifact/logs/ugas-validation.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/equipment.log" "$artifact/logs/equipment.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/front-compatibility.log" "$artifact/logs/front-compatibility.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/workflow-validation.json" "$artifact/governance/workflow-validation.json" 2>/dev/null || true
          exit 0
      - name: Validate bounded artifact security
        if: always()
        continue-on-error: true
        run: |
          set +e
          python scripts/validation/validate_github_review_security_v0170.py \
            --artifact-dir "$RUNNER_TEMP/ugas-review-artifact" \
            --manifest "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0170.json" \
            --output "$RUNNER_TEMP/security.json"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/security.exit"
          exit "$code"
      - name: Record final results and build provisional manifest
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python scripts/validation/record_v0170_results.py \
            --test-log "$RUNNER_TEMP/ugas-tests.log" --validation-log "$RUNNER_TEMP/ugas-validation.log" \
            --test-exit-code "$(cat "$RUNNER_TEMP/ugas-tests.exit" 2>/dev/null || echo 99)" \
            --validation-exit-code "$(cat "$RUNNER_TEMP/ugas-validation.exit" 2>/dev/null || echo 99)" \
            --state-exit-code "$(cat "$RUNNER_TEMP/state.exit" 2>/dev/null || echo 99)" \
            --equipment-exit-code "$(cat "$RUNNER_TEMP/equipment.exit" 2>/dev/null || echo 99)" \
            --direction-exit-code "$(cat "$RUNNER_TEMP/direction.exit" 2>/dev/null || echo 99)" \
            --matrix-exit-code "$(cat "$RUNNER_TEMP/matrix.exit" 2>/dev/null || echo 99)" \
            --front-compatibility-exit-code "$(cat "$RUNNER_TEMP/front.exit" 2>/dev/null || echo 99)" \
            --workflow-exit-code "$(cat "$RUNNER_TEMP/workflow.exit" 2>/dev/null || echo 99)" \
            --manifest-exit-code 0 --security-exit-code "$(cat "$RUNNER_TEMP/security.exit" 2>/dev/null || echo 99)" \
            --output-dir "$RUNNER_TEMP/ugas-review-evidence"
          python scripts/validation/build_github_review_manifest_v0170.py \
            --output-dir "$RUNNER_TEMP/ugas-review-evidence" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" \
            --head-branch "$HEAD_BRANCH" --pr-number "$PR_NUMBER" \
            --tests-json "$RUNNER_TEMP/ugas-review-evidence/test-results-v0170.json" \
            --validation-json "$RUNNER_TEMP/ugas-review-evidence/validation-results-v0170.json" \
            --gates-json "$RUNNER_TEMP/ugas-review-evidence/gate-results-v0170.json" \
            --front-compatibility-exit "$RUNNER_TEMP/front.exit"
          cp "$RUNNER_TEMP/ugas-review-evidence/github-review-manifest-v0170.json" "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0170.json"
          cp "$RUNNER_TEMP/ugas-review-evidence/test-results-v0170.json" "$RUNNER_TEMP/ugas-review-artifact/test-results-v0170.json"
          cp "$RUNNER_TEMP/ugas-review-evidence/validation-results-v0170.json" "$RUNNER_TEMP/ugas-review-artifact/validation-results-v0170.json"
          cp "$RUNNER_TEMP/ugas-review-evidence/gate-results-v0170.json" "$RUNNER_TEMP/ugas-review-artifact/gate-results-v0170.json"
          cp "$RUNNER_TEMP/security.json" "$RUNNER_TEMP/ugas-review-artifact/security-results-v0170.json"
      - name: Validate final v0.17.0 manifest
        if: always()
        continue-on-error: true
        run: |
          set +e
          python scripts/validation/validate_github_review_manifest_v0170.py \
            "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0170.json" \
            --result-output "$RUNNER_TEMP/final-manifest-validation-v0170.json"
          code=$?
          cp "$RUNNER_TEMP/final-manifest-validation-v0170.json" "$RUNNER_TEMP/ugas-review-artifact/manifest-validation-results-v0170.json" 2>/dev/null || true
          printf '%s\n' "$code" > "$RUNNER_TEMP/manifest.exit"
          exit "$code"
      - name: Finalize manifest gate from validation result
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python scripts/validation/record_v0170_results.py \
            --test-log "$RUNNER_TEMP/ugas-tests.log" --validation-log "$RUNNER_TEMP/ugas-validation.log" \
            --test-exit-code "$(cat "$RUNNER_TEMP/ugas-tests.exit" 2>/dev/null || echo 99)" \
            --validation-exit-code "$(cat "$RUNNER_TEMP/ugas-validation.exit" 2>/dev/null || echo 99)" \
            --state-exit-code "$(cat "$RUNNER_TEMP/state.exit" 2>/dev/null || echo 99)" \
            --equipment-exit-code "$(cat "$RUNNER_TEMP/equipment.exit" 2>/dev/null || echo 99)" \
            --direction-exit-code "$(cat "$RUNNER_TEMP/direction.exit" 2>/dev/null || echo 99)" \
            --matrix-exit-code "$(cat "$RUNNER_TEMP/matrix.exit" 2>/dev/null || echo 99)" \
            --front-compatibility-exit-code "$(cat "$RUNNER_TEMP/front.exit" 2>/dev/null || echo 99)" \
            --workflow-exit-code "$(cat "$RUNNER_TEMP/workflow.exit" 2>/dev/null || echo 99)" \
            --manifest-exit-code "$(cat "$RUNNER_TEMP/manifest.exit" 2>/dev/null || echo 99)" \
            --security-exit-code "$(cat "$RUNNER_TEMP/security.exit" 2>/dev/null || echo 99)" \
            --output-dir "$RUNNER_TEMP/ugas-review-evidence"
          python scripts/validation/build_github_review_manifest_v0170.py \
            --output-dir "$RUNNER_TEMP/ugas-review-evidence" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" \
            --head-branch "$HEAD_BRANCH" --pr-number "$PR_NUMBER" \
            --tests-json "$RUNNER_TEMP/ugas-review-evidence/test-results-v0170.json" \
            --validation-json "$RUNNER_TEMP/ugas-review-evidence/validation-results-v0170.json" \
            --gates-json "$RUNNER_TEMP/ugas-review-evidence/gate-results-v0170.json" \
            --front-compatibility-exit "$RUNNER_TEMP/front.exit"
          cp "$RUNNER_TEMP/ugas-review-evidence/github-review-manifest-v0170.json" "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0170.json"
          cp "$RUNNER_TEMP/ugas-review-evidence/test-results-v0170.json" "$RUNNER_TEMP/ugas-review-artifact/test-results-v0170.json"
          cp "$RUNNER_TEMP/ugas-review-evidence/validation-results-v0170.json" "$RUNNER_TEMP/ugas-review-artifact/validation-results-v0170.json"
          cp "$RUNNER_TEMP/ugas-review-evidence/gate-results-v0170.json" "$RUNNER_TEMP/ugas-review-artifact/gate-results-v0170.json"
      - name: Revalidate finalized v0.17.0 manifest
        if: always()
        continue-on-error: true
        run: |
          set +e
          python scripts/validation/validate_github_review_manifest_v0170.py \
            "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0170.json" \
            --result-output "$RUNNER_TEMP/final-manifest-validation-v0170.json"
          code=$?
          cp "$RUNNER_TEMP/final-manifest-validation-v0170.json" "$RUNNER_TEMP/ugas-review-artifact/manifest-validation-results-v0170.json" 2>/dev/null || true
          printf '%s\n' "$code" > "$RUNNER_TEMP/manifest.exit"
          exit "$code"
      - name: Write GitHub Step Summary
        if: always()
        run: |
          {
            echo '## UGAS GitHub-native v0.17.0 EQUIPMENT_OUTFITS runtime foundation evidence'
            echo "- Base: \`$BASE_REF\`"
            echo "- Head: \`$HEAD_REF\`"
            echo "- PR number: \`$PR_NUMBER\`"
            echo '- Gates: unit, official validation, active state, equipment runtime, v0.16.2 direction/cache regression, capability matrix, approved front compatibility, workflow, manifest and security.'
            echo '- Production: `production_approved=false`, `production_routing=BLOCKED`, `new_generation=0`; production equipment registry is empty.'
            echo '- Synthetic fixture contact sheet is explicitly `TEST_ONLY`.'
            echo "- Artifact: \`ugas-review-evidence-pr-${PR_NUMBER}-${HEAD_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bounded GitHub review artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ugas-review-evidence-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ugas-review-artifact
          if-no-files-found: error
          retention-days: 21
      - name: Enforce final review result after artifact upload
        if: always()
        run: |
          python scripts/validation/enforce_github_review_v0170.py \
            --manifest "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0170.json" \
            --manifest-validation "$RUNNER_TEMP/final-manifest-validation-v0170.json" \
            --security "$RUNNER_TEMP/security.json" \
            --equipment-exit "$RUNNER_TEMP/equipment.exit" \
            --direction-exit "$RUNNER_TEMP/direction.exit" \
            --front-compatibility-exit "$RUNNER_TEMP/front.exit"
