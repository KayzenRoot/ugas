name: UGAS GitHub review evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugas-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-evidence:
    name: UGAS Review / evidence
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project reproducibly
        if: always()
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check .
      - name: Prepare evidence directories
        if: always()
        run: mkdir -p "$RUNNER_TEMP/ugas-review-evidence" "$RUNNER_TEMP/ugas-review-artifact"
      - name: Build true-PNG review transport
        if: always()
        continue-on-error: true
        run: |
          set +e
          python scripts/validation/build_review_visual_transport_v0123.py
          code=$?
          cp docs/evidence/github-review-v0123/visual-manifest.json "$RUNNER_TEMP/ugas-review-evidence/visual-manifest.json" 2>/dev/null || true
          printf '%s\n' "$code" > "$RUNNER_TEMP/visual-transport.exit"
          exit "$code"
      - name: Run unit tests and capture totals
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -q 2>&1 | tee "$RUNNER_TEMP/ugas-tests.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/ugas-tests.exit"
          exit "$code"
      - name: Run official validation and capture totals
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/run_validation.py 2>&1 | tee "$RUNNER_TEMP/ugas-validation.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/ugas-validation.exit"
          exit "$code"
      - name: Validate active v0.16.2 state
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_state_consistency_v0162.py
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/state-consistency.exit"
          exit "$code"
      - name: Validate multi-direction runtime cache/state correction
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_direction_runtime_v0162.py
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/direction-runtime.exit"
          exit "$code"
      - name: Validate V1 capability matrix
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_v1_capability_matrix.py
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/capability-matrix.exit"
          exit "$code"
      - name: Run approved front compatibility regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/run_animation_runtime_v0151.py 2>&1 | tee "$RUNNER_TEMP/front-compatibility-v0151.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/front-compatibility.exit"
          exit "$code"
      - name: Validate workflow structure
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_github_workflows_v0124.py --root . --output "$RUNNER_TEMP/workflow-validation.json"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/workflow-validation.exit"
          exit "$code"
      - name: Validate visual transport and MIME signatures
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_review_visual_transport_v0123.py docs/evidence/github-review-v0123/visual-manifest.json --result-output "$RUNNER_TEMP/prebuild-visual-validation.json"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/visual-validation.exit"
          exit "$code"
      - name: Record initial v0.16.2 results
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python scripts/validation/record_v0162_results.py \
            --test-log "$RUNNER_TEMP/ugas-tests.log" --validation-log "$RUNNER_TEMP/ugas-validation.log" \
            --test-exit-code "$(cat "$RUNNER_TEMP/ugas-tests.exit" 2>/dev/null || echo 99)" \
            --validation-exit-code "$(cat "$RUNNER_TEMP/ugas-validation.exit" 2>/dev/null || echo 99)" \
            --state-exit-code "$(cat "$RUNNER_TEMP/state-consistency.exit" 2>/dev/null || echo 99)" \
            --direction-exit-code "$(cat "$RUNNER_TEMP/direction-runtime.exit" 2>/dev/null || echo 99)" \
            --matrix-exit-code "$(cat "$RUNNER_TEMP/capability-matrix.exit" 2>/dev/null || echo 99)" \
            --front-compatibility-exit-code "$(cat "$RUNNER_TEMP/front-compatibility.exit" 2>/dev/null || echo 99)" \
            --visual-exit-code "$(cat "$RUNNER_TEMP/visual-validation.exit" 2>/dev/null || echo 99)" \
            --workflow-exit-code "$(cat "$RUNNER_TEMP/workflow-validation.exit" 2>/dev/null || echo 99)" \
            --manifest-exit-code 99 --security-exit-code 99 --output-dir "$RUNNER_TEMP/ugas-review-evidence"
      - name: Build v0.16.2 review manifest before enforcement
        if: always()
        continue-on-error: true
        run: |
          python scripts/validation/build_github_review_manifest_v0162.py \
            --output-dir "$RUNNER_TEMP/ugas-review-evidence" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" \
            --head-branch "$HEAD_BRANCH" --pr-number "$PR_NUMBER" \
            --tests-json "$RUNNER_TEMP/ugas-review-evidence/test-results-v0162.json" \
            --validation-json "$RUNNER_TEMP/ugas-review-evidence/validation-results-v0162.json" \
            --gates-json "$RUNNER_TEMP/ugas-review-evidence/gate-results-v0162.json" \
            --visual-manifest "$RUNNER_TEMP/ugas-review-evidence/visual-manifest.json" \
            --front-compatibility-exit "$RUNNER_TEMP/front-compatibility.exit"
      - name: Validate v0.16.2 review manifest before artifact assembly
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_github_review_manifest_v0162.py \
            "$RUNNER_TEMP/ugas-review-evidence/github-review-manifest-v0162.json" \
            "$RUNNER_TEMP/ugas-review-evidence/visual-manifest.json" \
            --result-output "$RUNNER_TEMP/prebuild-manifest-validation.json"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/manifest-validation.exit"
          exit "$code"
      - name: Assemble bounded evidence artifact
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          artifact="$RUNNER_TEMP/ugas-review-artifact"
          mkdir -p "$artifact/visuals" "$artifact/state" "$artifact/direction-runtime" "$artifact/governance" "$artifact/logs"
          copy_if_present() { test -f "$1" && cp "$1" "$2"; }
          copy_if_present "$RUNNER_TEMP/ugas-review-evidence/github-review-manifest-v0162.json" "$artifact/github-review-manifest-v0162.json"
          copy_if_present "$RUNNER_TEMP/ugas-review-evidence/visual-manifest.json" "$artifact/visual-manifest.json"
          copy_if_present "$RUNNER_TEMP/ugas-review-evidence/test-results-v0162.json" "$artifact/test-results-v0162.json"
          copy_if_present "$RUNNER_TEMP/ugas-review-evidence/validation-results-v0162.json" "$artifact/validation-results-v0162.json"
          copy_if_present "$RUNNER_TEMP/ugas-review-evidence/gate-results-v0162.json" "$artifact/gate-results-v0162.json"
          copy_if_present "$RUNNER_TEMP/prebuild-manifest-validation.json" "$artifact/manifest-validation-results-v0162.json"
          copy_if_present docs/evidence/current-state.json "$artifact/state/current-state.json"
          copy_if_present docs/evidence/current-state-v0.15.1.json "$artifact/state/current-state-v0.15.1.json"
          copy_if_present docs/evidence/current-state-v0.15.0.json "$artifact/state/current-state-v0.15.0.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/v0161-rejection-correction-record-v0162.json "$artifact/direction-runtime/v0161-rejection-correction-record-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/state-consistency-v0162.json "$artifact/direction-runtime/state-consistency-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/validation-evidence-v0162.json "$artifact/direction-runtime/validation-evidence-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/negative-controls-v0162.json "$artifact/direction-runtime/negative-controls-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/invalid-vector-qa-v0162.json "$artifact/direction-runtime/invalid-vector-qa-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/test-only-production-safety-qa-v0162.json "$artifact/direction-runtime/test-only-production-safety-qa-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/coverage-manifest-v0162.json "$artifact/direction-runtime/coverage-manifest-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/direction-contract-v0162.json "$artifact/direction-runtime/direction-contract-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/synthetic-fixture-manifest-v0162.json "$artifact/direction-runtime/synthetic-fixture-manifest-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0161/synthetic-direction-contact-sheet-v0160.png "$artifact/direction-runtime/synthetic-direction-contact-sheet-v0160.png"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/direction-quantization-v0162.json "$artifact/direction-runtime/direction-quantization-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/alias-mapping-v0162.json "$artifact/direction-runtime/alias-mapping-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/fallback-qa-v0162.json "$artifact/direction-runtime/fallback-qa-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/mirror-qa-v0162.json "$artifact/direction-runtime/mirror-qa-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/provenance-qa-v0162.json "$artifact/direction-runtime/provenance-qa-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/cache-unresolved-class-qa-v0162.json "$artifact/direction-runtime/cache-unresolved-class-qa-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/cache-order-negative-controls-v0162.json "$artifact/direction-runtime/cache-order-negative-controls-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/test-only-cache-mode-qa-v0162.json "$artifact/direction-runtime/test-only-cache-mode-qa-v0162.json"
          copy_if_present docs/evidence/multi-direction-runtime-v0162/fixture-qa-v0162.json "$artifact/direction-runtime/fixture-qa-v0162.json"
          copy_if_present docs/evidence/review-index-v0.12.2.json "$artifact/governance/review-index-v0.12.2.json"
          copy_if_present "$RUNNER_TEMP/workflow-validation.json" "$artifact/governance/workflow-validation.json"
          copy_if_present "$RUNNER_TEMP/ugas-tests.log" "$artifact/logs/ugas-tests.log"
          copy_if_present "$RUNNER_TEMP/ugas-validation.log" "$artifact/logs/ugas-validation.log"
          copy_if_present "$RUNNER_TEMP/front-compatibility-v0151.log" "$artifact/logs/front-compatibility-v0151.log"
          copy_if_present "$RUNNER_TEMP/front-compatibility.exit" "$artifact/logs/front-compatibility.exit"
          copy_if_present docs/evidence/github-governance-v0151/death-front-v0151-external-visual-approval.json "$artifact/governance/death-front-v0151-external-visual-approval.json"
          copy_if_present docs/evidence/github-governance-v0151/death-front-v0151-provenance.json "$artifact/governance/death-front-v0151-provenance.json"
          if test -d docs/evidence/animation-runtime-v0150; then cp -R docs/evidence/animation-runtime-v0150 "$artifact/governance/v0150-rejected-history"; fi
          if test -d docs/evidence/animation-runtime-v0151; then cp -R docs/evidence/animation-runtime-v0151 "$artifact/governance/v0151-approved-history"; fi
          exit 0
      - name: Validate bounded artifact security
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_github_review_security_v0162.py \
            --artifact-dir "$RUNNER_TEMP/ugas-review-artifact" \
            --manifest "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0162.json" \
            --output "$RUNNER_TEMP/security-results-v0162.json"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/security.exit"
          exit "$code"
      - name: Record final results and refresh manifest
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python scripts/validation/record_v0162_results.py \
            --test-log "$RUNNER_TEMP/ugas-tests.log" --validation-log "$RUNNER_TEMP/ugas-validation.log" \
            --test-exit-code "$(cat "$RUNNER_TEMP/ugas-tests.exit" 2>/dev/null || echo 99)" \
            --validation-exit-code "$(cat "$RUNNER_TEMP/ugas-validation.exit" 2>/dev/null || echo 99)" \
            --state-exit-code "$(cat "$RUNNER_TEMP/state-consistency.exit" 2>/dev/null || echo 99)" \
            --direction-exit-code "$(cat "$RUNNER_TEMP/direction-runtime.exit" 2>/dev/null || echo 99)" \
            --matrix-exit-code "$(cat "$RUNNER_TEMP/capability-matrix.exit" 2>/dev/null || echo 99)" \
            --front-compatibility-exit-code "$(cat "$RUNNER_TEMP/front-compatibility.exit" 2>/dev/null || echo 99)" \
            --visual-exit-code "$(cat "$RUNNER_TEMP/visual-validation.exit" 2>/dev/null || echo 99)" \
            --workflow-exit-code "$(cat "$RUNNER_TEMP/workflow-validation.exit" 2>/dev/null || echo 99)" \
            --manifest-exit-code "$(cat "$RUNNER_TEMP/manifest-validation.exit" 2>/dev/null || echo 99)" \
            --security-exit-code "$(cat "$RUNNER_TEMP/security.exit" 2>/dev/null || echo 99)" \
            --output-dir "$RUNNER_TEMP/ugas-review-evidence"
          python scripts/validation/build_github_review_manifest_v0162.py \
            --output-dir "$RUNNER_TEMP/ugas-review-evidence" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" \
            --head-branch "$HEAD_BRANCH" --pr-number "$PR_NUMBER" \
            --tests-json "$RUNNER_TEMP/ugas-review-evidence/test-results-v0162.json" \
            --validation-json "$RUNNER_TEMP/ugas-review-evidence/validation-results-v0162.json" \
            --gates-json "$RUNNER_TEMP/ugas-review-evidence/gate-results-v0162.json" \
            --visual-manifest "$RUNNER_TEMP/ugas-review-evidence/visual-manifest.json" \
            --front-compatibility-exit "$RUNNER_TEMP/front-compatibility.exit"
          cp "$RUNNER_TEMP/ugas-review-evidence/github-review-manifest-v0162.json" "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0162.json"
          cp "$RUNNER_TEMP/ugas-review-evidence/visual-manifest.json" "$RUNNER_TEMP/ugas-review-artifact/visual-manifest.json"
          cp "$RUNNER_TEMP/ugas-review-evidence/test-results-v0162.json" "$RUNNER_TEMP/ugas-review-artifact/test-results-v0162.json"
          cp "$RUNNER_TEMP/ugas-review-evidence/validation-results-v0162.json" "$RUNNER_TEMP/ugas-review-artifact/validation-results-v0162.json"
          cp "$RUNNER_TEMP/ugas-review-evidence/gate-results-v0162.json" "$RUNNER_TEMP/ugas-review-artifact/gate-results-v0162.json"
          cp "$RUNNER_TEMP/security-results-v0162.json" "$RUNNER_TEMP/ugas-review-artifact/security-results-v0162.json"
      - name: Final v0.16.2 manifest validation
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_github_review_manifest_v0162.py \
            "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0162.json" \
            "$RUNNER_TEMP/ugas-review-artifact/visual-manifest.json" \
            --result-output "$RUNNER_TEMP/final-manifest-validation-v0162.json"
          code=$?
          cp "$RUNNER_TEMP/final-manifest-validation-v0162.json" "$RUNNER_TEMP/ugas-review-artifact/manifest-validation-results-v0162.json" 2>/dev/null || true
          printf '%s\n' "$code" > "$RUNNER_TEMP/final-manifest-validation.exit"
          exit "$code"
      - name: Write GitHub Step Summary
        if: always()
        run: |
          {
            echo '## UGAS GitHub-native v0.16.2 multi-direction runtime cache/state correction evidence'
            echo "- Base: \`$BASE_REF\`"
            echo "- Head: \`$HEAD_REF\`"
            echo "- PR number: \`$PR_NUMBER\`"
            echo '- Gates: unit, official validation, active state, direction integrity correction, matrix, front compatibility, visual transport, workflow, manifest and security.'
            echo '- Production: `production_approved=false`, `production_routing=BLOCKED`, `new_generation=0`.'
            echo '- Real directional coverage: `south` only; synthetic eight-direction fixtures are test-only.'
            echo "- Artifact: \`ugas-review-evidence-pr-${PR_NUMBER}-${HEAD_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bounded GitHub review artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ugas-review-evidence-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ugas-review-artifact
          if-no-files-found: error
          retention-days: 21
      - name: Enforce final review result after artifact upload
        if: always()
        run: |
          python scripts/validation/enforce_github_review_v0162.py \
            --manifest "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0162.json" \
            --manifest-validation "$RUNNER_TEMP/final-manifest-validation-v0162.json" \
            --security "$RUNNER_TEMP/security-results-v0162.json" \
            --direction-exit "$RUNNER_TEMP/direction-runtime.exit" \
            --front-compatibility-exit "$RUNNER_TEMP/front-compatibility.exit"
