name: UGAS GitHub review evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugas-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-evidence:
    name: UGAS Review / evidence
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project reproducibly
        if: always()
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check .
      - name: Prepare bounded evidence directories
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ugas-review-evidence" "$RUNNER_TEMP/ugas-review-artifact"
          : > "$RUNNER_TEMP/ugas-tests.log"
          : > "$RUNNER_TEMP/ugas-validation.log"
          for file in environment state regressions matrix workflow; do printf '%s\n' 99 > "$RUNNER_TEMP/$file.exit"; done
          printf '%s\n' 99 > "$RUNNER_TEMP/security.exit"
      - name: Run environment/tilesets foundation and capture evidence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/run_environment_tilesets_runtime_v0200.py 2>&1 | tee "$RUNNER_TEMP/environment.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/environment.exit"
          exit "$code"
      - name: Run unit tests and capture totals
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -q 2>&1 | tee "$RUNNER_TEMP/ugas-tests.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/ugas-tests.exit"
          exit "$code"
      - name: Validate capability matrix before official validation
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_v1_capability_matrix.py
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/matrix.exit"
          exit "$code"
      - name: Run official validation and capture totals
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/run_validation.py 2>&1 | tee "$RUNNER_TEMP/ugas-validation.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/ugas-validation.exit"
          exit "$code"
      - name: Validate active v0.20.0 state
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_state_consistency_v0200.py
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/state.exit"
          exit "$code"
      - name: Validate frozen runtime regressions
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          status=0
          for script in validate_items_props_runtime_v0191_regression.py validate_creatures_monsters_runtime_v0182_regression.py validate_equipment_runtime_v0171_regression.py validate_direction_runtime_v0162_regression.py validate_front_animation_v0151_regression.py; do
            python "scripts/validation/$script" || status=1
          done
          printf '%s\n' "$status" > "$RUNNER_TEMP/regressions.exit"
          exit "$status"
      - name: Validate capability matrix
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_v1_capability_matrix.py
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/matrix.exit"
          exit "$code"
      - name: Validate workflow structure
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_github_workflows_v0124.py --root . --output "$RUNNER_TEMP/workflow-validation.json"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/workflow.exit"
          exit "$code"
      - name: Record provisional v0.20.0 results
        if: always()
        continue-on-error: true
        run: |
          python scripts/validation/record_v0200_results.py --output-dir "$RUNNER_TEMP/ugas-review-evidence" --tests-log "$RUNNER_TEMP/ugas-tests.log" --validation-log "$RUNNER_TEMP/ugas-validation.log" --test-exit-code "$(cat "$RUNNER_TEMP/ugas-tests.exit")" --validation-exit-code "$(cat "$RUNNER_TEMP/ugas-validation.exit")" --environment-exit-code "$(cat "$RUNNER_TEMP/environment.exit")" --state-exit-code "$(cat "$RUNNER_TEMP/state.exit")" --regressions-exit-code "$(cat "$RUNNER_TEMP/regressions.exit")" --matrix-exit-code "$(cat "$RUNNER_TEMP/matrix.exit")" --workflow-exit-code "$(cat "$RUNNER_TEMP/workflow.exit")"
      - name: Build provisional v0.20.0 review manifest
        if: always()
        continue-on-error: true
        run: |
          python scripts/validation/build_github_review_manifest_v0200.py --output-dir "$RUNNER_TEMP/ugas-review-evidence" --repository-root . --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --head-branch "$HEAD_BRANCH" --pr-number "$PR_NUMBER" --tests-json "$RUNNER_TEMP/ugas-review-evidence/test-results-v0200.json" --validation-json "$RUNNER_TEMP/ugas-review-evidence/validation-results-v0200.json" --gates-json "$RUNNER_TEMP/ugas-review-evidence/gate-results-v0200.json"
      - name: Assemble bounded evidence artifact
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          artifact="$RUNNER_TEMP/ugas-review-artifact"
          mkdir -p "$artifact/environment-tilesets" "$artifact/items-props" "$artifact/creatures-monsters" "$artifact/equipment" "$artifact/direction" "$artifact/front" "$artifact/state" "$artifact/logs" "$artifact/governance"
          cp "$RUNNER_TEMP/ugas-review-evidence/"*.json "$artifact/" 2>/dev/null || true
          cp docs/evidence/current-state.json "$artifact/state/current-state.json" 2>/dev/null || true
          cp -R docs/evidence/environment-tilesets-runtime-v0200/. "$artifact/environment-tilesets/" 2>/dev/null || true
          cp docs/evidence/items-props-runtime-v0191/execution-evidence-v0191.json "$artifact/items-props/" 2>/dev/null || true
          cp docs/evidence/creatures-monsters-runtime-v0182/execution-evidence-v0182.json "$artifact/creatures-monsters/" 2>/dev/null || true
          cp docs/evidence/equipment-outfits-runtime-v0171/execution-evidence-v0171.json "$artifact/equipment/" 2>/dev/null || true
          cp docs/evidence/multi-direction-runtime-v0162/execution-evidence-v0162.json "$artifact/direction/" 2>/dev/null || true
          cp docs/evidence/animation-runtime-v0151/execution-evidence-v0151.json "$artifact/front/" 2>/dev/null || true
          cp "$RUNNER_TEMP/ugas-tests.log" "$artifact/logs/ugas-tests.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/ugas-validation.log" "$artifact/logs/ugas-validation.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/environment.log" "$artifact/logs/environment.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/workflow-validation.json" "$artifact/governance/workflow-validation.json" 2>/dev/null || true
      - name: Validate bounded artifact security
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_github_review_security_v0200.py --artifact-dir "$RUNNER_TEMP/ugas-review-artifact" --manifest "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0200.json" --output "$RUNNER_TEMP/security.json"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/security.exit"
          exit "$code"
      - name: Validate provisional v0.20.0 manifest
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_github_review_manifest_v0200.py "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0200.json" --result-output "$RUNNER_TEMP/provisional-manifest-validation-v0200.json"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/manifest.exit"
          exit "$code"
      - name: Record final v0.20.0 results and rebuild manifest
        if: always()
        continue-on-error: true
        run: |
          python scripts/validation/record_v0200_results.py --output-dir "$RUNNER_TEMP/ugas-review-evidence" --tests-log "$RUNNER_TEMP/ugas-tests.log" --validation-log "$RUNNER_TEMP/ugas-validation.log" --test-exit-code "$(cat "$RUNNER_TEMP/ugas-tests.exit")" --validation-exit-code "$(cat "$RUNNER_TEMP/ugas-validation.exit")" --environment-exit-code "$(cat "$RUNNER_TEMP/environment.exit")" --state-exit-code "$(cat "$RUNNER_TEMP/state.exit")" --regressions-exit-code "$(cat "$RUNNER_TEMP/regressions.exit")" --matrix-exit-code "$(cat "$RUNNER_TEMP/matrix.exit")" --workflow-exit-code "$(cat "$RUNNER_TEMP/workflow.exit")"
          python scripts/validation/build_github_review_manifest_v0200.py --output-dir "$RUNNER_TEMP/ugas-review-evidence" --repository-root . --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --head-branch "$HEAD_BRANCH" --pr-number "$PR_NUMBER" --tests-json "$RUNNER_TEMP/ugas-review-evidence/test-results-v0200.json" --validation-json "$RUNNER_TEMP/ugas-review-evidence/validation-results-v0200.json" --gates-json "$RUNNER_TEMP/ugas-review-evidence/gate-results-v0200.json"
          cp "$RUNNER_TEMP/ugas-review-evidence/"*.json "$RUNNER_TEMP/ugas-review-artifact/" 2>/dev/null || true
          cp "$RUNNER_TEMP/security.json" "$RUNNER_TEMP/ugas-review-artifact/security-results-v0200.json" 2>/dev/null || true
      - name: Validate final v0.20.0 manifest
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_github_review_manifest_v0200.py "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0200.json" --result-output "$RUNNER_TEMP/final-manifest-validation-v0200.json"
          code=$?
          cp "$RUNNER_TEMP/final-manifest-validation-v0200.json" "$RUNNER_TEMP/ugas-review-artifact/manifest-validation-results-v0200.json" 2>/dev/null || true
          printf '%s\n' "$code" > "$RUNNER_TEMP/final-manifest.exit"
          exit "$code"
      - name: Write GitHub Step Summary
        if: always()
        run: |
          {
            echo '## UGAS GitHub-native v0.20.0 ENVIRONMENT_TILESETS foundation evidence'
            echo "- Base: \`$BASE_REF\`"
            echo "- Head: \`$HEAD_REF\`"
            echo "- PR number: \`$PR_NUMBER\`"
            echo '- Production: `real_environment_asset_coverage=NONE`, `synthetic_environment_fixture=TEST_ONLY`, `production_approved=false`, `production_routing=BLOCKED`, `new_generation=0`; production registry is empty.'
            echo '- Final stop: v0.20.0 is technically qualified and remains OPEN for external review; do not merge or start Maps/Minimap, UI, VFX, orchestration or production art.'
            echo "- Artifact: \`ugas-review-evidence-pr-${PR_NUMBER}-${HEAD_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bounded GitHub review artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ugas-review-evidence-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ugas-review-artifact
          if-no-files-found: error
          retention-days: 21
      - name: Enforce final review result after artifact upload
        if: always()
        run: |
          python scripts/validation/enforce_github_review_v0200.py --manifest "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0200.json" --manifest-validation "$RUNNER_TEMP/final-manifest-validation-v0200.json" --security "$RUNNER_TEMP/security.json" --environment-exit "$RUNNER_TEMP/environment.exit" --state-exit "$RUNNER_TEMP/state.exit"
