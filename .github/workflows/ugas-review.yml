name: UGAS GitHub review evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugas-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-evidence:
    name: UGAS Review / evidence
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project reproducibly
        if: always()
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check .
      - name: Prepare bounded evidence directories
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ugas-review-evidence" "$RUNNER_TEMP/ugas-review-artifact"
          : > "$RUNNER_TEMP/ugas-tests.log"
          : > "$RUNNER_TEMP/ugas-validation.log"
          for file in vfx state matrix workflow; do printf '%s\n' 99 > "$RUNNER_TEMP/$file.exit"; done
      - name: Run VFX asset family v0.23.2 correction and capture evidence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/run_vfx_asset_family_runtime_v0232.py 2>&1 | tee "$RUNNER_TEMP/vfx.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/vfx.exit"
          exit "$code"
      - name: Run unit tests and capture totals
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -q 2>&1 | tee "$RUNNER_TEMP/ugas-tests.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/ugas-tests.exit"
          exit "$code"
      - name: Validate active state
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_state_consistency_v0232.py
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/state.exit"
          exit "$code"
      - name: Validate capability matrix
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_v1_capability_matrix.py
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/matrix.exit"
          exit "$code"
      - name: Run official validation and capture totals
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/run_validation.py 2>&1 | tee "$RUNNER_TEMP/ugas-validation.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/ugas-validation.exit"
          exit "$code"
      - name: Validate workflow structure
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_github_workflows_v0124.py --root . --output "$RUNNER_TEMP/workflow-validation.json"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/workflow.exit"
          exit "$code"
      - name: Record v0.23.2 results
        if: always()
        continue-on-error: true
        run: |
          python scripts/validation/record_vfx_asset_family_results_v0232.py --output-dir "$RUNNER_TEMP/ugas-review-evidence" --tests-log "$RUNNER_TEMP/ugas-tests.log" --validation-log "$RUNNER_TEMP/ugas-validation.log" --tests-exit "$(cat "$RUNNER_TEMP/ugas-tests.exit")" --validation-exit "$(cat "$RUNNER_TEMP/ugas-validation.exit")" --vfx-exit "$(cat "$RUNNER_TEMP/vfx.exit")" --state-exit "$(cat "$RUNNER_TEMP/state.exit")" --matrix-exit "$(cat "$RUNNER_TEMP/matrix.exit")" --workflow-exit "$(cat "$RUNNER_TEMP/workflow.exit")"
      - name: Assemble bounded evidence artifact
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          artifact="$RUNNER_TEMP/ugas-review-artifact"
          mkdir -p "$artifact/docs/evidence/vfx-asset-family-runtime-v0232" "$artifact/docs/evidence/vfx-asset-family-runtime-v0231" "$artifact/docs/evidence/vfx-asset-family-runtime-v0230" "$artifact/docs/evidence/ui-asset-family-runtime-v0223" "$artifact/docs/evidence/ui-asset-family-runtime-v0222" "$artifact/docs/evidence/ui-asset-family-runtime-v0221" "$artifact/docs/evidence/ui-asset-family-runtime-v0220" "$artifact/docs/evidence/github-governance-v0223" "$artifact/docs/evidence/github-governance-v0221" "$artifact/docs/evidence/github-governance-v0220" "$artifact/docs/evidence/maps-minimap-runtime-v0213" "$artifact/logs"
          cp -R docs/evidence/vfx-asset-family-runtime-v0232/. "$artifact/docs/evidence/vfx-asset-family-runtime-v0232/" 2>/dev/null || true
          cp -R docs/evidence/vfx-asset-family-runtime-v0231/. "$artifact/docs/evidence/vfx-asset-family-runtime-v0231/" 2>/dev/null || true
          cp -R docs/evidence/vfx-asset-family-runtime-v0230/. "$artifact/docs/evidence/vfx-asset-family-runtime-v0230/" 2>/dev/null || true
          cp REVIEW-v0.23.0.md "$artifact/REVIEW-v0.23.0.md" 2>/dev/null || true
          cp REVIEW-v0.23.1.md "$artifact/REVIEW-v0.23.1.md" 2>/dev/null || true
          cp -R docs/evidence/ui-asset-family-runtime-v0223/. "$artifact/docs/evidence/ui-asset-family-runtime-v0223/" 2>/dev/null || true
          cp -R docs/evidence/ui-asset-family-runtime-v0222/. "$artifact/docs/evidence/ui-asset-family-runtime-v0222/" 2>/dev/null || true
          cp -R docs/evidence/ui-asset-family-runtime-v0221/. "$artifact/docs/evidence/ui-asset-family-runtime-v0221/" 2>/dev/null || true
          cp -R docs/evidence/ui-asset-family-runtime-v0220/. "$artifact/docs/evidence/ui-asset-family-runtime-v0220/" 2>/dev/null || true
          cp docs/evidence/current-state.json "$artifact/docs/evidence/current-state.json" 2>/dev/null || true
          cp docs/evidence/current-state-v0213.json "$artifact/docs/evidence/current-state-v0213.json" 2>/dev/null || true
          cp -R docs/evidence/github-governance-v0223/. "$artifact/docs/evidence/github-governance-v0223/" 2>/dev/null || true
          cp -R docs/evidence/github-governance-v0221/. "$artifact/docs/evidence/github-governance-v0221/" 2>/dev/null || true
          cp docs/evidence/github-governance-v0220/v0213-closure-completion-binding.json "$artifact/docs/evidence/github-governance-v0220/" 2>/dev/null || true
          cp docs/evidence/github-governance-v0220/v0213-post-merge-binding.json "$artifact/docs/evidence/github-governance-v0220/" 2>/dev/null || true
          cp -R docs/evidence/maps-minimap-runtime-v0213/. "$artifact/docs/evidence/maps-minimap-runtime-v0213/" 2>/dev/null || true
          cp REVIEW-v0.22.3.md "$artifact/REVIEW-v0.22.3.md" 2>/dev/null || true
          cp "$RUNNER_TEMP/ugas-review-evidence/"*.json "$artifact/" 2>/dev/null || true
          cp "$RUNNER_TEMP/governance-v0223.json" "$artifact/governance-v0223.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/ugas-tests.log" "$artifact/logs/ugas-tests.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/ugas-validation.log" "$artifact/logs/ugas-validation.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/vfx.log" "$artifact/logs/vfx.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/workflow-validation.json" "$artifact/logs/workflow-validation.json" 2>/dev/null || true
      - name: Build v0.23.2 exact-head manifest
        if: always()
        continue-on-error: true
        run: |
          python scripts/validation/build_github_review_manifest_v0232.py --output-dir "$RUNNER_TEMP/ugas-review-artifact" --repository-root . --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --head-branch "$HEAD_BRANCH" --pr-number "$PR_NUMBER" --tests-json "$RUNNER_TEMP/ugas-review-evidence/test-results-v0232.json" --validation-json "$RUNNER_TEMP/ugas-review-evidence/validation-results-v0232.json" --gates-json "docs/evidence/vfx-asset-family-runtime-v0232/hard-gates-v0232.json" --controls-json "docs/evidence/vfx-asset-family-runtime-v0232/negative-controls-v0232.json" --determinism-json "docs/evidence/vfx-asset-family-runtime-v0232/full-slice-two-run-determinism-v0232.json" --production-json "docs/evidence/vfx-asset-family-runtime-v0232/production-registry-v0232.json"
      - name: Validate bounded artifact security v0.23.2
        if: always()
        continue-on-error: true
        run: python scripts/validation/validate_github_review_security_v0232.py --artifact-dir "$RUNNER_TEMP/ugas-review-artifact" --manifest "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0232.json" --output "$RUNNER_TEMP/security-v0232.json"
      - name: Validate v0.23.2 exact-head manifest
        if: always()
        continue-on-error: true
        run: python scripts/validation/validate_github_review_manifest_v0232.py "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0232.json" --result-output "$RUNNER_TEMP/final-manifest-validation-v0232.json"
      - name: Add final manifest/security results
        if: always()
        run: |
          cp "$RUNNER_TEMP/security-v0232.json" "$RUNNER_TEMP/ugas-review-artifact/security-results-v0232.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/final-manifest-validation-v0232.json" "$RUNNER_TEMP/ugas-review-artifact/manifest-validation-results-v0232.json" 2>/dev/null || true
      - name: Write GitHub Step Summary
        if: always()
        run: |
          {
            echo '## UGAS GitHub-native v0.23.2 VFX asset-family correction evidence'
            echo "- Base: \`$BASE_REF\`"
            echo "- Head: \`$HEAD_REF\`"
            echo "- PR number: \`$PR_NUMBER\`"
            echo '- Production: `real_ui_asset_coverage=NONE`, `synthetic_ui_fixture=TEST_ONLY`, `production_approved=false`, `production_routing=BLOCKED`, `new_generation=0`.'
            echo '- Stop: PR #14 remains OPEN/unmerged for external Sol review; do not start orchestration or production VFX.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bounded GitHub review artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ugas-review-evidence-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ugas-review-artifact
          if-no-files-found: error
          retention-days: 21
      - name: Enforce final review result after artifact upload (v0.23.2)
        if: always()
        run: python scripts/validation/enforce_github_review_v0232.py --manifest "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0232.json" --manifest-validation "$RUNNER_TEMP/final-manifest-validation-v0232.json" --security "$RUNNER_TEMP/security-v0232.json" --vfx-exit "$RUNNER_TEMP/vfx.exit" --state-exit "$RUNNER_TEMP/state.exit"
