name: UGAS GitHub review evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugas-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-evidence:
    name: UGAS Review / evidence
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project reproducibly
        run: python -m pip install --disable-pip-version-check .
      - name: Prepare bounded evidence directories
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ugas-review-evidence" "$RUNNER_TEMP/ugas-review-artifact" "$RUNNER_TEMP/logs"
          : > "$RUNNER_TEMP/ugas-tests.log"
          : > "$RUNNER_TEMP/ugas-validation.log"
          for file in state matrix orchestration workflow schema; do printf '%s\n' 99 > "$RUNNER_TEMP/$file.exit"; done
      - name: Run orchestration runtime v0.24.7 F-44R/F-46R and capture evidence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/run_orchestration_runtime_v0247.py 2>&1 | tee "$RUNNER_TEMP/orchestration.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/orchestration.exit"
          exit "$code"
      - name: Run unit tests and capture totals
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -q 2>&1 | tee "$RUNNER_TEMP/ugas-tests.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/ugas-tests.exit"
          exit "$code"
      - name: Validate active v0.24.7 state
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_state_consistency_v0247.py | tee "$RUNNER_TEMP/state-validation-v0247.json"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/state.exit"
          exit "$code"
      - name: Validate capability matrix
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_v1_capability_matrix.py
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/matrix.exit"
          exit "$code"
      - name: Validate orchestration v0.24.7 schemas
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_orchestration_schema_v0247.py
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/schema.exit"
          exit "$code"
      - name: Run official validation and capture totals
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/run_validation.py 2>&1 | tee "$RUNNER_TEMP/ugas-validation.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/ugas-validation.exit"
          exit "$code"
      - name: Validate workflow structure
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_github_workflows_v0124.py --root . --output "$RUNNER_TEMP/workflow-validation.json"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/workflow.exit"
          exit "$code"
      - name: Detect active canonical state version
        id: canonical-state-version
        if: always()
        shell: bash
        run: |
          set +e
          version=$(python -c "import json, pathlib; print(json.loads(pathlib.Path('docs/evidence/current-state.json').read_text(encoding='utf-8')).get('version', 'unknown'))" 2>&1)
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "$version"
            exit "$code"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo "Active canonical state version: $version"
      - name: Validate post-merge canonical state v0.25.2
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.2'
        shell: bash
        run: |
          set -o pipefail
          python scripts/validation/validate_state_consistency_v0252.py 2>&1 | tee "$RUNNER_TEMP/state-validation-v0252.json"
      - name: Validate post-merge canonical promotion evidence v0.25.2
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.2'
        shell: bash
        run: |
          set -o pipefail
          python scripts/validation/validate_post_merge_canonical_promotion_v0252.py --output "$RUNNER_TEMP/post-merge-canonical-promotion-v0252.json" 2>&1 | tee "$RUNNER_TEMP/post-merge-canonical-promotion-v0252.log"
      - name: Record v0.24.7 results
        if: always()
        continue-on-error: true
        run: |
          python scripts/validation/record_orchestration_results_v0247.py --output-dir "$RUNNER_TEMP/ugas-review-evidence" --tests-log "$RUNNER_TEMP/ugas-tests.log" --validation-log "$RUNNER_TEMP/ugas-validation.log" --tests-exit "$(cat "$RUNNER_TEMP/ugas-tests.exit")" --validation-exit "$(cat "$RUNNER_TEMP/ugas-validation.exit")" --state-exit "$(cat "$RUNNER_TEMP/state.exit")" --matrix-exit "$(cat "$RUNNER_TEMP/matrix.exit")" --orchestration-exit "$(cat "$RUNNER_TEMP/orchestration.exit")" --workflow-exit "$(cat "$RUNNER_TEMP/workflow.exit")" --schema-exit "$(cat "$RUNNER_TEMP/schema.exit")"
          cp "$RUNNER_TEMP/state-validation-v0247.json" "$RUNNER_TEMP/ugas-review-evidence/state-validation-v0247.json" 2>/dev/null || true
          cp docs/evidence/orchestration-runtime-v0247/schema-validation-v0247.json "$RUNNER_TEMP/ugas-review-evidence/schema-validation-v0247.json" 2>/dev/null || true
      - name: Assemble bounded evidence artifact
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          artifact="$RUNNER_TEMP/ugas-review-artifact"
          mkdir -p "$artifact/docs/evidence/orchestration-runtime-v0247" "$artifact/docs/evidence/github-governance-v0247" "$artifact/logs" "$artifact/schemas"
          cp -R docs/evidence/orchestration-runtime-v0247/. "$artifact/docs/evidence/orchestration-runtime-v0247/"
          cp docs/evidence/current-state.json "$artifact/docs/evidence/current-state.json"
          cp -R docs/evidence/github-governance-v0247/. "$artifact/docs/evidence/github-governance-v0247/" 2>/dev/null || true
          cp schemas/current-state-v0247.json "$artifact/schemas/current-state-v0247.json"
          cp schemas/orchestration-runtime-v0247.json "$artifact/schemas/orchestration-runtime-v0247.json"
          cp REVIEW-v0.24.7.md "$artifact/REVIEW-v0.24.7.md"
          mkdir -p "$artifact/docs/evidence/post-merge-canonical-promotion-v0252"
          cp -R docs/evidence/post-merge-canonical-promotion-v0252/. "$artifact/docs/evidence/post-merge-canonical-promotion-v0252/"
          cp schemas/current-state-v0252.json "$artifact/schemas/current-state-v0252.json"
          cp REVIEW-v0.25.2.md "$artifact/REVIEW-v0.25.2.md"
          cp "$RUNNER_TEMP/state-validation-v0252.json" "$artifact/state-validation-v0252.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/post-merge-canonical-promotion-v0252.json" "$artifact/post-merge-canonical-promotion-v0252.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/ugas-review-evidence/"*.json "$artifact/" 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import os, sys
          sys.path.insert(0, "scripts/validation")
          from validate_github_review_security_v0247 import sanitize_exported_text
          artifact = Path(os.environ["RUNNER_TEMP"]) / "ugas-review-artifact" / "logs"
          artifact.mkdir(parents=True, exist_ok=True)
          mapping = {
              "ugas-tests.log": Path(os.environ["RUNNER_TEMP"]) / "ugas-tests.log",
              "ugas-validation.log": Path(os.environ["RUNNER_TEMP"]) / "ugas-validation.log",
              "orchestration.log": Path(os.environ["RUNNER_TEMP"]) / "orchestration.log",
              "workflow-validation.json": Path(os.environ["RUNNER_TEMP"]) / "workflow-validation.json",
          }
          for name, source in mapping.items():
              if source.is_file():
                  (artifact / name).write_text(sanitize_exported_text(source.read_text(encoding="utf-8", errors="replace")), encoding="utf-8")
          PY
      - name: Build v0.24.7 exact-head manifest
        if: always()
        continue-on-error: true
        run: |
          python scripts/validation/build_github_review_manifest_v0247.py --output-dir "$RUNNER_TEMP/ugas-review-artifact" --repository-root . --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --head-branch "$HEAD_BRANCH" --pr-number "$PR_NUMBER" --tests-json "$RUNNER_TEMP/ugas-review-evidence/test-results-v0247.json" --validation-json "$RUNNER_TEMP/ugas-review-evidence/validation-results-v0247.json" --state-validation-json "$RUNNER_TEMP/ugas-review-evidence/state-validation-v0247.json" --gates-json docs/evidence/orchestration-runtime-v0247/hard-gates-v0247.json --controls-json docs/evidence/orchestration-runtime-v0247/negative-controls-v0247.json --determinism-json docs/evidence/orchestration-runtime-v0247/full-slice-two-run-determinism-v0247.json --production-json docs/evidence/orchestration-runtime-v0247/production-boundary-v0247.json --provider-json docs/evidence/orchestration-runtime-v0247/provider-boundary-v0247.json --family-json docs/evidence/orchestration-runtime-v0247/family-concurrency-v0247.json
      - name: Validate v0.24.7 exact-head manifest
        if: always()
        continue-on-error: true
        run: python scripts/validation/validate_github_review_manifest_v0247.py "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0247.json" --result-output "$RUNNER_TEMP/ugas-review-artifact/manifest-validation-results-v0247.json"
      - name: Write artifact identity preflight into bounded artifact
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/enforce_github_review_v0247.py --stage pre-upload --no-require-security --no-require-inventory --output "$RUNNER_TEMP/ugas-review-artifact/pre-upload-enforcement-v0247.json" --manifest "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0247.json" --manifest-validation "$RUNNER_TEMP/ugas-review-artifact/manifest-validation-results-v0247.json" --state-exit "$(cat "$RUNNER_TEMP/state.exit")" --orchestration-exit "$(cat "$RUNNER_TEMP/orchestration.exit")" --schema-exit "$(cat "$RUNNER_TEMP/schema.exit")" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --pr-number "$PR_NUMBER" 2>&1 | tee "$RUNNER_TEMP/pre-upload-enforcement-v0247.log"
          code=${PIPESTATUS[0]}
          {
            echo '## UGAS v0.24.7 artifact identity preflight enforcement'
            echo 'This machine-readable result is copied into the bounded artifact before the final security scan. It is not the post-upload final GitHub enforcement gate.'
            cat "$RUNNER_TEMP/pre-upload-enforcement-v0247.log"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Sanitize bounded artifact export paths v0.24.7
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, sys
          sys.path.insert(0, "scripts/validation")
          from validate_github_review_security_v0247 import sanitize_exported_text
          root = Path(os.environ["RUNNER_TEMP"]) / "ugas-review-artifact"
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              sanitized = sanitize_exported_text(text)
              if sanitized != text:
                  path.write_text(sanitized, encoding="utf-8")
          PY
      - name: Validate bounded artifact security v0.24.7
        if: always()
        continue-on-error: true
        run: python scripts/validation/validate_github_review_security_v0247.py --artifact-dir "$RUNNER_TEMP/ugas-review-artifact" --manifest "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0247.json" --output "$RUNNER_TEMP/ugas-review-artifact/security-results-v0247.json"
      - name: Verify inventory and security before upload
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/enforce_github_review_v0247.py --stage pre-upload --require-security --require-inventory --manifest "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0247.json" --manifest-validation "$RUNNER_TEMP/ugas-review-artifact/manifest-validation-results-v0247.json" --security "$RUNNER_TEMP/ugas-review-artifact/security-results-v0247.json" --state-exit "$(cat "$RUNNER_TEMP/state.exit")" --orchestration-exit "$(cat "$RUNNER_TEMP/orchestration.exit")" --schema-exit "$(cat "$RUNNER_TEMP/schema.exit")" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --pr-number "$PR_NUMBER"
          code=$?
          exit "$code"
      - name: Write GitHub Step Summary
        if: always()
        run: |
          {
            echo '## UGAS GitHub-native v0.24.7 orchestration runtime evidence'
            echo "- Base: \`$BASE_REF\`"
            echo "- Head: \`$HEAD_REF\`"
            echo "- PR number: \`$PR_NUMBER\`"
            echo '- Production: `real_asset_generation=NONE`, `synthetic_fixture=TEST_ONLY`, `production_approved=false`, `production_routing=BLOCKED`, `new_generation=0`.'
            echo '- Artifact identity preflight and final security inventory are inside the upload. Post-upload final enforcement remains a separate GitHub job gate.'
            echo '- Stop: PR remains OPEN/unmerged for external Sol review; V1 final acceptance has not started.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bounded GitHub review artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ugas-review-evidence-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ugas-review-artifact
          if-no-files-found: error
          retention-days: 21
      - name: Enforce final review result after artifact upload (v0.24.7)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/enforce_github_review_v0247.py --stage final --manifest "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0247.json" --manifest-validation "$RUNNER_TEMP/ugas-review-artifact/manifest-validation-results-v0247.json" --security "$RUNNER_TEMP/ugas-review-artifact/security-results-v0247.json" --state-exit "$(cat "$RUNNER_TEMP/state.exit")" --orchestration-exit "$(cat "$RUNNER_TEMP/orchestration.exit")" --schema-exit "$(cat "$RUNNER_TEMP/schema.exit")" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --pr-number "$PR_NUMBER" 2>&1 | tee "$RUNNER_TEMP/final-enforcement-v0247.log"
          code=${PIPESTATUS[0]}
          {
            echo '## UGAS v0.24.7 post-upload final enforcement'
            echo 'This GitHub job gate runs after artifact upload and is not claimed to be inside the already-uploaded artifact.'
            cat "$RUNNER_TEMP/final-enforcement-v0247.log"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Prepare bounded V1 final acceptance evidence directories
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.0'
        run: |
          mkdir -p "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/logs" "$RUNNER_TEMP/ugas-v1-final-acceptance-evidence"
          : > "$RUNNER_TEMP/v1-final-acceptance.log"
          for file in acceptance state-v0250 schema-v0250; do printf '%s\n' 99 > "$RUNNER_TEMP/$file.exit"; done
      - name: Run V1 final acceptance slice v0.25.0 and capture evidence
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.0'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/run_v1_final_acceptance_v0250.py --output-dir docs/evidence/v1-final-acceptance --pr-number "$PR_NUMBER" --pr-head-sha "$HEAD_REF" --pr-state OPEN 2>&1 | tee "$RUNNER_TEMP/v1-final-acceptance.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/acceptance.exit"
          exit "$code"
      - name: Validate V1 final acceptance state consistency v0.25.0
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.0'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_state_consistency_v0250.py 2>&1 | tee "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/state-validation-v0250.json"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/state-v0250.exit"
          exit "$code"
      - name: Validate V1 final acceptance schema v0.25.0
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.0'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_v1_acceptance_schema_v0250.py --output "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/logs/schema-validation-v0250.json"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/schema-v0250.exit"
          exit "$code"
      - name: Record v0.25.0 final acceptance results
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.0'
        continue-on-error: true
        run: |
          python scripts/validation/record_v1_acceptance_results_v0250.py --output-dir "$RUNNER_TEMP/ugas-v1-final-acceptance-evidence" --tests-log "$RUNNER_TEMP/ugas-tests.log" --validation-log "$RUNNER_TEMP/ugas-validation.log" --tests-exit "$(cat "$RUNNER_TEMP/ugas-tests.exit")" --validation-exit "$(cat "$RUNNER_TEMP/ugas-validation.exit")" --state-exit "$(cat "$RUNNER_TEMP/state-v0250.exit")" --matrix-exit "$(cat "$RUNNER_TEMP/matrix.exit")" --orchestration-exit "$(cat "$RUNNER_TEMP/orchestration.exit")" --workflow-exit "$(cat "$RUNNER_TEMP/workflow.exit")" --schema-exit "$(cat "$RUNNER_TEMP/schema-v0250.exit")"
      - name: Assemble bounded V1 final acceptance artifact
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.0'
        continue-on-error: true
        shell: bash
        run: |
          artifact="$RUNNER_TEMP/ugas-v1-final-acceptance-artifact"
          mkdir -p "$artifact/docs/evidence/v1-final-acceptance" "$artifact/docs/evidence/github-governance-v0124" "$artifact/docs/evidence/github-governance-v0247" "$artifact/logs" "$artifact/schemas"
          cp -R docs/evidence/v1-final-acceptance/. "$artifact/docs/evidence/v1-final-acceptance/"
          cp docs/evidence/current-state.json "$artifact/docs/evidence/current-state.json"
          cp -R docs/evidence/orchestration-runtime-v0247/. "$artifact/docs/evidence/orchestration-runtime-v0247/"
          cp docs/evidence/github-governance-v0124/dashboard-external-visual-approval.json "$artifact/docs/evidence/github-governance-v0124/dashboard-external-visual-approval.json"
          cp docs/evidence/github-governance-v0247/v0247-external-approval.json "$artifact/docs/evidence/github-governance-v0247/v0247-external-approval.json"
          cp schemas/current-state-v0250.json "$artifact/schemas/current-state-v0250.json"
          cp REVIEW-UGAS-V1-FINAL-ACCEPTANCE.md "$artifact/REVIEW-UGAS-V1-FINAL-ACCEPTANCE.md"
          cp environment-results-v0250.json "$artifact/environment-results-v0250.json"
          cp "$RUNNER_TEMP/ugas-v1-final-acceptance-evidence/test-results-v0250.json" "$artifact/test-results-v0250.json"
          cp "$RUNNER_TEMP/ugas-v1-final-acceptance-evidence/validation-results-v0250.json" "$artifact/validation-results-v0250.json"
          python - <<'PY'
          from pathlib import Path
          import os, sys
          sys.path.insert(0, "scripts/validation")
          from validate_github_review_security_v0250 import sanitize_exported_text
          root = Path(os.environ["RUNNER_TEMP"])
          logs = root / "ugas-v1-final-acceptance-artifact" / "logs"
          logs.mkdir(parents=True, exist_ok=True)
          mapping = {
              "v1-final-acceptance.log": root / "v1-final-acceptance.log",
              "ugas-tests.log": root / "ugas-tests.log",
              "ugas-validation.log": root / "ugas-validation.log",
              "workflow-validation.json": root / "workflow-validation.json",
          }
          for name, source in mapping.items():
              if source.is_file():
                  (logs / name).write_text(sanitize_exported_text(source.read_text(encoding="utf-8", errors="replace")), encoding="utf-8")
          PY
      - name: Build v0.25.0 exact-head final acceptance manifest
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.0'
        continue-on-error: true
        run: |
          python scripts/validation/build_github_review_manifest_v0250.py --output-dir "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact" --repository-root . --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --head-branch "$HEAD_BRANCH" --pr-number "$PR_NUMBER" --tests-json "$RUNNER_TEMP/ugas-v1-final-acceptance-evidence/test-results-v0250.json" --validation-json "$RUNNER_TEMP/ugas-v1-final-acceptance-evidence/validation-results-v0250.json" --state-validation-json "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/state-validation-v0250.json" --summary-json docs/evidence/v1-final-acceptance/final-acceptance-summary.json --gates-json docs/evidence/v1-final-acceptance/hard-gates.json --controls-json docs/evidence/v1-final-acceptance/negative-controls.json --uads-json docs/evidence/v1-final-acceptance/uads-handoff.json
      - name: Validate v0.25.0 exact-head final acceptance manifest
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.0'
        continue-on-error: true
        run: python scripts/validation/validate_github_review_manifest_v0250.py "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/github-review-manifest-v0250.json" --result-output "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/manifest-validation-results-v0250.json"
      - name: Write V1 final acceptance artifact identity preflight into bounded artifact
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.0'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/enforce_github_review_v0250.py --stage pre-upload --no-require-security --no-require-inventory --output "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/pre-upload-enforcement-v0250.json" --manifest "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/github-review-manifest-v0250.json" --manifest-validation "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/manifest-validation-results-v0250.json" --state-exit "$(cat "$RUNNER_TEMP/state-v0250.exit")" --acceptance-exit "$(cat "$RUNNER_TEMP/acceptance.exit")" --schema-exit "$(cat "$RUNNER_TEMP/schema-v0250.exit")" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --pr-number "$PR_NUMBER" --repository-root . 2>&1 | tee "$RUNNER_TEMP/pre-upload-enforcement-v0250.log"
          code=${PIPESTATUS[0]}
          {
            echo '## UGAS v0.25.0 V1 final acceptance artifact identity preflight enforcement'
            echo 'This machine-readable result is copied into the bounded V1 final acceptance artifact before the final security scan. It is not the post-upload final GitHub enforcement gate.'
            cat "$RUNNER_TEMP/pre-upload-enforcement-v0250.log"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Sanitize bounded V1 final acceptance artifact export paths
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.0'
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, sys
          sys.path.insert(0, "scripts/validation")
          from validate_github_review_security_v0250 import sanitize_exported_text
          root = Path(os.environ["RUNNER_TEMP"]) / "ugas-v1-final-acceptance-artifact"
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              sanitized = sanitize_exported_text(text)
              if sanitized != text:
                  path.write_text(sanitized, encoding="utf-8")
          PY
      - name: Validate bounded V1 final acceptance artifact security
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.0'
        continue-on-error: true
        run: python scripts/validation/validate_github_review_security_v0250.py --artifact-dir "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact" --manifest "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/github-review-manifest-v0250.json" --output "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/security-results-v0250.json"
      - name: Verify V1 final acceptance inventory and security before upload
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.0'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/enforce_github_review_v0250.py --stage pre-upload --require-security --require-inventory --manifest "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/github-review-manifest-v0250.json" --manifest-validation "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/manifest-validation-results-v0250.json" --security "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/security-results-v0250.json" --state-exit "$(cat "$RUNNER_TEMP/state-v0250.exit")" --acceptance-exit "$(cat "$RUNNER_TEMP/acceptance.exit")" --schema-exit "$(cat "$RUNNER_TEMP/schema-v0250.exit")" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --pr-number "$PR_NUMBER" --repository-root .
          code=$?
          exit "$code"
      - name: Write V1 final acceptance GitHub Step Summary
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.0'
        run: |
          {
            echo '## UGAS GitHub-native v0.25.0 V1 final acceptance evidence'
            echo "- Base: \`$BASE_REF\`"
            echo "- Head: \`$HEAD_REF\`"
            echo "- PR number: \`$PR_NUMBER\`"
            echo '- Production: `production_approved=false`, `production_routing=BLOCKED`, `real_asset_generation=NONE`, `new_generation=0`, `provider_submit_calls=0`.'
            echo '- The v0.24.7 review steps above record the historical PR #15-bound gate; this work order is gated by the v0.25.0 final enforcement step after upload.'
            echo '- Artifact inventory, security, manifest and preflight enforcement are inside the bounded V1 final acceptance artifact. Post-upload final enforcement remains a separate GitHub job gate.'
            echo '- Stop: PR remains OPEN/unmerged for external Sol review; V1 technical baseline acceptance is not production approval.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bounded V1 final acceptance artifact
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ugas-v1-final-acceptance-evidence-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ugas-v1-final-acceptance-artifact
          if-no-files-found: error
          retention-days: 21
      - name: Enforce final V1 final acceptance result after artifact upload (v0.25.0)
        if: github.event.pull_request.number && steps.canonical-state-version.outputs.version == '0.25.0'
        shell: bash
        run: |
          set +e
          python scripts/validation/enforce_github_review_v0250.py --stage final --manifest "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/github-review-manifest-v0250.json" --manifest-validation "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/manifest-validation-results-v0250.json" --security "$RUNNER_TEMP/ugas-v1-final-acceptance-artifact/security-results-v0250.json" --state-exit "$(cat "$RUNNER_TEMP/state-v0250.exit")" --acceptance-exit "$(cat "$RUNNER_TEMP/acceptance.exit")" --schema-exit "$(cat "$RUNNER_TEMP/schema-v0250.exit")" --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --pr-number "$PR_NUMBER" --repository-root . 2>&1 | tee "$RUNNER_TEMP/final-enforcement-v0250.log"
          code=${PIPESTATUS[0]}
          {
            echo '## UGAS v0.25.0 post-upload final V1 final acceptance enforcement'
            echo 'This GitHub job gate runs after artifact upload and is not claimed to be inside the already-uploaded artifact.'
            cat "$RUNNER_TEMP/final-enforcement-v0250.log"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
