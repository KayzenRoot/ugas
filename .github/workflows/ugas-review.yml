name: UGAS GitHub review evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ugas-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-evidence:
    name: UGAS Review / evidence
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project reproducibly
        run: python -m pip install --disable-pip-version-check .
      - name: Prepare bounded evidence directories
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ugas-review-evidence" "$RUNNER_TEMP/ugas-review-artifact" "$RUNNER_TEMP/logs"
          : > "$RUNNER_TEMP/ugas-tests.log"
          : > "$RUNNER_TEMP/ugas-validation.log"
          for file in state matrix orchestration workflow schema; do printf '%s\n' 99 > "$RUNNER_TEMP/$file.exit"; done
      - name: Run orchestration runtime v0.24.1 F31-F36 and capture evidence
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/run_orchestration_runtime_v0242.py 2>&1 | tee "$RUNNER_TEMP/orchestration.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/orchestration.exit"
          exit "$code"
      - name: Run unit tests and capture totals
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -q 2>&1 | tee "$RUNNER_TEMP/ugas-tests.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/ugas-tests.exit"
          exit "$code"
      - name: Validate active v0.24.1 state
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_state_consistency_v0242.py | tee "$RUNNER_TEMP/state-validation-v0242.json"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/state.exit"
          exit "$code"
      - name: Validate capability matrix
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_v1_capability_matrix.py
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/matrix.exit"
          exit "$code"
      - name: Validate orchestration v0.24.1 schemas
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_orchestration_schema_v0242.py
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/schema.exit"
          exit "$code"
      - name: Run official validation and capture totals
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/run_validation.py 2>&1 | tee "$RUNNER_TEMP/ugas-validation.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$RUNNER_TEMP/ugas-validation.exit"
          exit "$code"
      - name: Validate workflow structure
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validation/validate_github_workflows_v0124.py --root . --output "$RUNNER_TEMP/workflow-validation.json"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/workflow.exit"
          exit "$code"
      - name: Record v0.24.1 results
        if: always()
        continue-on-error: true
        run: |
          python scripts/validation/record_orchestration_results_v0242.py --output-dir "$RUNNER_TEMP/ugas-review-evidence" --tests-log "$RUNNER_TEMP/ugas-tests.log" --validation-log "$RUNNER_TEMP/ugas-validation.log" --tests-exit "$(cat "$RUNNER_TEMP/ugas-tests.exit")" --validation-exit "$(cat "$RUNNER_TEMP/ugas-validation.exit")" --state-exit "$(cat "$RUNNER_TEMP/state.exit")" --matrix-exit "$(cat "$RUNNER_TEMP/matrix.exit")" --orchestration-exit "$(cat "$RUNNER_TEMP/orchestration.exit")" --workflow-exit "$(cat "$RUNNER_TEMP/workflow.exit")" --schema-exit "$(cat "$RUNNER_TEMP/schema.exit")"
          cp "$RUNNER_TEMP/state-validation-v0242.json" "$RUNNER_TEMP/ugas-review-evidence/state-validation-v0242.json" 2>/dev/null || true
          cp docs/evidence/orchestration-runtime-v0242/schema-validation-v0242.json "$RUNNER_TEMP/ugas-review-evidence/schema-validation-v0242.json" 2>/dev/null || true
      - name: Assemble bounded evidence artifact
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          artifact="$RUNNER_TEMP/ugas-review-artifact"
          mkdir -p "$artifact/docs/evidence/orchestration-runtime-v0242" "$artifact/logs"
          cp -R docs/evidence/orchestration-runtime-v0242/. "$artifact/docs/evidence/orchestration-runtime-v0242/"
          cp docs/evidence/current-state.json "$artifact/docs/evidence/current-state.json"
          mkdir -p "$artifact/schemas"
          cp schemas/current-state-v0242.json "$artifact/schemas/current-state-v0242.json"
          cp schemas/orchestration-runtime-v0242.json "$artifact/schemas/orchestration-runtime-v0242.json"
          cp REVIEW-v0.24.2.md "$artifact/REVIEW-v0.24.2.md"
          cp "$RUNNER_TEMP/ugas-review-evidence/"*.json "$artifact/" 2>/dev/null || true
          cp "$RUNNER_TEMP/ugas-tests.log" "$artifact/logs/ugas-tests.log"
          cp "$RUNNER_TEMP/ugas-validation.log" "$artifact/logs/ugas-validation.log"
          cp "$RUNNER_TEMP/orchestration.log" "$artifact/logs/orchestration.log"
          cp "$RUNNER_TEMP/workflow-validation.json" "$artifact/logs/workflow-validation.json" 2>/dev/null || true
      - name: Build v0.24.1 exact-head manifest
        if: always()
        continue-on-error: true
        run: |
          python scripts/validation/build_github_review_manifest_v0242.py --output-dir "$RUNNER_TEMP/ugas-review-artifact" --repository-root . --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --head-branch "$HEAD_BRANCH" --pr-number "$PR_NUMBER" --tests-json "$RUNNER_TEMP/ugas-review-evidence/test-results-v0242.json" --validation-json "$RUNNER_TEMP/ugas-review-evidence/validation-results-v0242.json" --state-validation-json "$RUNNER_TEMP/ugas-review-evidence/state-validation-v0242.json" --gates-json docs/evidence/orchestration-runtime-v0242/hard-gates-v0242.json --controls-json docs/evidence/orchestration-runtime-v0242/negative-controls-v0242.json --determinism-json docs/evidence/orchestration-runtime-v0242/full-slice-two-run-determinism-v0242.json --production-json docs/evidence/orchestration-runtime-v0242/production-boundary-v0242.json --provider-json docs/evidence/orchestration-runtime-v0242/provider-boundary-v0242.json --family-json docs/evidence/orchestration-runtime-v0242/family-concurrency-v0242.json
      - name: Validate bounded artifact security v0.24.1
        if: always()
        continue-on-error: true
        run: python scripts/validation/validate_github_review_security_v0242.py --artifact-dir "$RUNNER_TEMP/ugas-review-artifact" --manifest "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0242.json" --output "$RUNNER_TEMP/security-v0242.json"
      - name: Validate v0.24.1 exact-head manifest
        if: always()
        continue-on-error: true
        run: python scripts/validation/validate_github_review_manifest_v0242.py "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0242.json" --result-output "$RUNNER_TEMP/final-manifest-validation-v0242.json"
      - name: Add final manifest/security results
        if: always()
        run: |
          cp "$RUNNER_TEMP/security-v0242.json" "$RUNNER_TEMP/ugas-review-artifact/security-results-v0242.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/final-manifest-validation-v0242.json" "$RUNNER_TEMP/ugas-review-artifact/manifest-validation-results-v0242.json" 2>/dev/null || true
      - name: Write GitHub Step Summary
        if: always()
        run: |
          {
            echo '## UGAS GitHub-native v0.24.1 orchestration runtime evidence'
            echo "- Base: \`$BASE_REF\`"
            echo "- Head: \`$HEAD_REF\`"
            echo "- PR number: \`$PR_NUMBER\`"
            echo '- Production: `real_asset_generation=NONE`, `synthetic_fixture=TEST_ONLY`, `production_approved=false`, `production_routing=BLOCKED`, `new_generation=0`.'
            echo '- Stop: PR remains OPEN/unmerged for external Sol review; V1 final acceptance has not started.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bounded GitHub review artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ugas-review-evidence-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ugas-review-artifact
          if-no-files-found: error
          retention-days: 21
      - name: Enforce final review result after artifact upload (v0.24.1)
        if: always()
        shell: bash
        run: |
          set +e
          python scripts/validation/enforce_github_review_v0242.py --manifest "$RUNNER_TEMP/ugas-review-artifact/github-review-manifest-v0242.json" --manifest-validation "$RUNNER_TEMP/final-manifest-validation-v0242.json" --security "$RUNNER_TEMP/security-v0242.json" --state-exit "$(cat "$RUNNER_TEMP/state.exit")" --orchestration-exit "$(cat "$RUNNER_TEMP/orchestration.exit")" --schema-exit "$(cat "$RUNNER_TEMP/schema.exit")" 2>&1 | tee "$RUNNER_TEMP/final-enforcement-v0242.log"
          code=${PIPESTATUS[0]}
          {
            echo '## UGAS v0.24.1 final enforcement'
            cat "$RUNNER_TEMP/final-enforcement-v0242.log"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
