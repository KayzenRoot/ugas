name: UGAS CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ugas-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-validation:
    name: UGAS CI / unit-and-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project reproducibly
        run: python -m pip install --disable-pip-version-check .
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -q
      - name: Active v0.16.1 state consistency
        env:
          PYTHONPATH: src
        run: python scripts/validation/validate_state_consistency_v0161.py
      - name: Official validation
        env:
          PYTHONPATH: src
        run: python scripts/validation/run_validation.py
      - name: DEATH_ANIMATION_FRONT runtime, regressions and negative controls
        env:
          PYTHONPATH: src
        run: python scripts/validation/run_animation_runtime_v0151.py
      - name: V1 capability matrix validation
        env:
          PYTHONPATH: src
        run: python scripts/validation/validate_v1_capability_matrix.py
      - name: Multi-direction runtime integrity correction validation
        env:
          PYTHONPATH: src
        run: python scripts/validation/validate_direction_runtime_v0161.py
      - name: Workflow structure validation
        env:
          PYTHONPATH: src
        run: python scripts/validation/validate_github_workflows_v0124.py --root .

  docker-smoke:
    name: UGAS CI / docker-smoke
    runs-on: ubuntu-latest
    env:
      UGAS_DASHBOARD_PORT: '18765'
      UGAS_REPO_PATH: ${{ github.workspace }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Prepare isolated CI runtime directory
        run: |
          mkdir -p "$UGAS_REPO_PATH/.ugas/runtime"
          mkdir -p "$RUNNER_TEMP/ugas-runtime"
          chmod 0777 "$RUNNER_TEMP/ugas-runtime"
          echo "UGAS_RUNTIME_PATH=$RUNNER_TEMP/ugas-runtime" >> "$GITHUB_ENV"
      - name: Compose config
        run: docker compose -f compose.yaml config
      - name: Build dashboard image
        run: docker compose -f compose.yaml build dashboard
      - name: Start CI dashboard container
        run: docker compose -f compose.yaml up -d dashboard
      - name: Verify dashboard APIs
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${UGAS_DASHBOARD_PORT}/api/status" >/tmp/ugas-status.json && \
               curl --fail --silent --show-error "http://127.0.0.1:${UGAS_DASHBOARD_PORT}/api/health" >/tmp/ugas-health.json; then
              cat /tmp/ugas-status.json
              cat /tmp/ugas-health.json
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.yaml logs --no-color dashboard
          exit 1
      - name: Tear down only CI runner container
        if: always()
        run: docker compose -f compose.yaml rm -sf dashboard
